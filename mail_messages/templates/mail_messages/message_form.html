{% extends "base.html" %}

{% block content %}

<h1>
    {% if object %}
        Редактирование сообщения
    {% else %}
        Создание сообщения
    {% endif %}
</h1>


<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Сохранить
    </button>

</form>


<a href="{% url 'mail_messages:list' %}">
    Назад
</a>


{% endblock %}
