{% extends "base.html" %}


{% block title %}
Удаление клиента
{% endblock %}


{% block content %}


<div class="row justify-content-center">

    <div class="col-md-6">


        <div class="card shadow-sm">


            <div class="card-header bg-danger text-white">

                <h4 class="mb-0">
                    Удаление клиента
                </h4>

            </div>


            <div class="card-body">


                <p>
                    Вы действительно хотите удалить клиента?
                </p>


                <div class="alert alert-warning">

                    <strong>
                        {{ object.email }}
                    </strong>

                    <br>

                    {{ object.full_name }}

                </div>



                <form method="post">

                    {% csrf_token %}


                    <button type="submit"
                            class="btn btn-danger">

                        Удалить

                    </button>



                    <a href="{% url 'clients:list' %}"
                       class="btn btn-secondary">

                        Отмена

                    </a>


                </form>


            </div>


        </div>


    </div>


</div>


{% endblock %}
