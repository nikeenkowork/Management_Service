{% extends "base.html" %}

{% block content %}

<h2>Удаление клиента</h2>

<p>
    Вы действительно хотите удалить клиента?
</p>

<p>
    <strong>{{ object.email }}</strong>
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">
        Да, удалить
    </button>

    <a href="{% url 'clients:list' %}">
        Отмена
    </a>
</form>

{% endblock %}
